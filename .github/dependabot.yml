# Dependency updates, proposed rather than applied. Everything Composer
# installs here is a development tool (the plugin ships none of it), and
# the actions run in CI. Minor and patch updates come once a week in one pull
# request per ecosystem; security updates as soon as they are published.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      composer:
        applies-to: version-updates
        update-types: [minor, patch]
      composer-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      actions:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']
